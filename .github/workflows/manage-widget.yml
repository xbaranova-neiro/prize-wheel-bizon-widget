name: Управление виджетом Bizon

on:
  workflow_dispatch:
    inputs:
      state:
        description: Какую прокрутку показать
        required: true
        type: choice
        options:
          - off
          - round-1
          - round-2
          - round-3

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Обновить состояние кнопки
        env:
          WIDGET_STATE: ${{ inputs.state }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const prefix = 'window.__BIZON_PRIZE_WHEEL_CONFIG__=';
          const source = fs.readFileSync('config.js', 'utf8').trim();
          const config = JSON.parse(source.slice(prefix.length).replace(/;$/, ''));
          const match = process.env.WIDGET_STATE.match(/^round-(\d)$/);
          config.activeRound = match ? Number(match[1]) : null;
          for (const key of Object.keys(config.rounds)) config.rounds[key].enabled = key === String(config.activeRound);
          config.version += 1;
          fs.writeFileSync('config.js', prefix + JSON.stringify(config, null, 2) + ';\n');
          NODE
      - name: Опубликовать изменение
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.js
          git commit -m "control: set widget to ${{ inputs.state }}" || exit 0
          git push
